<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.container{
    margin-top:50px;
}

.card{
    background:#1e293b;
    border:none;
    border-radius:20px;
    padding:20px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center mb-5">
Mood Analytics Dashboard
</h1>

<div class="card">

<div style="height:400px;">
    <canvas id="myChart"></canvas>
</div>

</div>

</div>

<script>

const ctx = document.getElementById('myChart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: {{ moods | tojson }},

        datasets: [{

            label: 'Mood Count',

            data: {{ counts | tojson }},

            borderWidth: 1

        }]

    }

});

</script>

</body>

</html>
