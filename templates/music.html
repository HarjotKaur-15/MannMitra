<!DOCTYPE html>
<html>

<head>

<title>Relaxing Music</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(to right,#0f172a,#1e293b);
    color:white;
    font-family:Arial;
}

.container{
    margin-top:50px;
    max-width:900px;
}

.card{
    background:#1e293b;
    border:none;
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.track-title{
    color:#38bdf8;
    margin-bottom:15px;
}

.quote{
    text-align:center;
    color:#94a3b8;
    margin-bottom:40px;
    font-style:italic;
}

audio{
    width:100%;
}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center mb-4">
Relaxing Music Therapy
</h1>

<p class="quote">
"Music heals the mind and calms the soul."
</p>

<!-- Nature Sounds -->

<div class="card">

<h3 class="track-title">
🌿 Nature Sounds
</h3>

<audio controls>

<source
src="{{ url_for('static', filename='music/nature.mp3') }}"
type="audio/mp3"
>

</audio>

</div>

<!-- Rain Sounds -->

<div class="card">

<h3 class="track-title">
🌧 Rain Meditation
</h3>

<audio controls>

<source
src="{{ url_for('static', filename='music/rain.mp3') }}"
type="audio/mp3"
>

</audio>

</div>

<!-- Meditation Music -->

<div class="card">

<h3 class="track-title">
🧘 Meditation Music
</h3>

<audio controls>

<source
src="{{ url_for('static', filename='music/meditation.mp3') }}"
type="audio/mp3"
>

</audio>

</div>

</div>

</body>

</html>
