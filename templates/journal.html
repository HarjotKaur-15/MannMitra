<!DOCTYPE html>
<html>

<head>

<title>Mood Journal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(to right,#0f172a,#1e293b);
    color:white;
    font-family:Arial;
}

.container{
    max-width:800px;
    margin-top:50px;
}

.card{
    background:#1e293b;
    border:none;
    border-radius:25px;
    padding:30px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

textarea{
    background:#0f172a !important;
    color:white !important;
    border:none !important;
    border-radius:15px !important;
    padding:20px !important;
}

textarea::placeholder{
    color:#94a3b8;
}

.quote{
    color:#38bdf8;
    text-align:center;
    margin-bottom:20px;
    font-style:italic;
}

.mood-btn{
    font-size:30px;
    margin:5px;
    cursor:pointer;
    transition:0.3s;
}

.mood-btn:hover{
    transform:scale(1.2);
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="text-center mb-4">
Daily Mood Journal
</h1>

<p class="quote">
"Your feelings are valid. Every day is a new beginning."
</p>

<div class="text-center mb-4">

<span class="mood-btn">😊</span>
<span class="mood-btn">😌</span>
<span class="mood-btn">😔</span>
<span class="mood-btn">😢</span>
<span class="mood-btn">😡</span>
<span class="mood-btn">😰</span>

</div>

<form action="/save_journal" method="POST">

<textarea
name="entry"
rows="10"
class="form-control"
placeholder="Write about your thoughts, emotions, stress, happiness, or anything on your mind today..."
required
></textarea>

<br>

<button class="btn btn-info w-100 p-3">
Save Journal Entry
</button>

</form>

</div>

</div>

</body>

</html>
