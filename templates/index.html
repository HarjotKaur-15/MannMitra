<!DOCTYPE html>
<html>

<head>

<title>MannMitra</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(to right,#0f172a,#1e293b);
    color:white;
    font-family:Arial;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.card-box{
    transition:0.3s;
    border-radius:20px;
}

.card-box:hover{
    transform:translateY(-10px);
}

</style>

</head>

<body>

<div class="container hero">

<h1 class="display-1 fw-bold">
MannMitra
</h1>

<p class="lead mb-5">
Your AI Mental Health Companion
</p>

<div class="row g-4 justify-content-center">

<!-- AI CHATBOT -->

<div class="col-md-3">

<div class="card bg-dark text-white p-4 text-center card-box">

<h3>AI Chatbot</h3>

<a href="/chatbot" class="btn btn-info mt-3">
Open
</a>

</div>

</div>

<!-- MOOD JOURNAL -->

<div class="col-md-3">

<div class="card bg-dark text-white p-4 text-center card-box">

<h3>Mood Journal</h3>

<a href="/journal" class="btn btn-info mt-3">
Open
</a>

</div>

</div>

<!-- BREATHING -->

<div class="col-md-3">

<div class="card bg-dark text-white p-4 text-center card-box">

<h3>Breathing</h3>

<a href="/breathing" class="btn btn-info mt-3">
Open
</a>

</div>

</div>

<!-- MUSIC -->

<div class="col-md-3">

<div class="card bg-dark text-white p-4 text-center card-box">

<h3>Relaxing Music</h3>

<a href="/music" class="btn btn-info mt-3">
Open
</a>

</div>

</div>

<!-- DASHBOARD -->

<div class="col-md-3">

<div class="card bg-dark text-white p-4 text-center card-box">

<h3>Dashboard</h3>

<a href="/dashboard" class="btn btn-info mt-3">
Open
</a>

</div>

</div>

</div>

</div>

</body>

</html>
