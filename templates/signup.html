<!DOCTYPE html>
<html>

<head>

<title>Signup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f172a;
    color:white;
}

.container{
    max-width:500px;
    margin-top:100px;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="text-center mb-4">
Signup
</h1>

<form method="POST">

<input
type="text"
name="username"
class="form-control mb-3"
placeholder="Username"
required
>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required
>

<button class="btn btn-info w-100">
Create Account
</button>

</form>

</div>

</div>

</body>

</html>
